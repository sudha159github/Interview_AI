<mat-toolbar class="app-toolbar">
  <a routerLink="/" class="brand">
    <mat-icon>psychology</mat-icon>
    <span>Interview AI</span>
  </a>

  <span class="spacer"></span>

  @if (auth.currentUser(); as user) {
    <span class="user-name">{{ user.userName }}</span>
  }

  <button matButton (click)="logout()">
    <mat-icon>logout</mat-icon>
    Log out
  </button>
</mat-toolbar>

@if (auth.sessionEnding()) {
<div class="session-banner" role="alert">
<mat-icon>schedule</mat-icon>
<span>Your session is about to end. Save your work, then sign in again.</span>
<button matButton (click)="signInAgain()">Sign in again</button>
</div>
}
<main id="main" class="app-content">
<router-outlet />
</main>

<main class="app-content">
  <router-outlet />
</main>
