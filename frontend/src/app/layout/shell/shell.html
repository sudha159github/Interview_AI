<nav class="navbar app-navbar sticky-top">
<div class="container-xl d-flex align-items-center gap-3">
<a routerLink="/" class="navbar-brand app-brand d-flex align-items-center gap-2 m-0">
<span class="brand-mark">
<i class="bi bi-stars"></i>
</span>
<span class="brand-text">Interview <span class="brand-accent">AI</span></span>
</a>
<span class="flex-grow-1"></span>
@if (auth.currentUser(); as user) {
<span class="app-user d-none d-sm-inline">
<i class="bi bi-person-circle me-1"></i>{{ user.userName }}
</span>
}
<button type="button" class="btn btn-sm btn-outline-light app-signout" (click)="logout()">
<i class="bi bi-box-arrow-right me-1"></i>Sign out
</button>
</div>
</nav>
@if (auth.sessionEnding()) {
<div class="session-banner" role="alert">
<div class="container-xl d-flex align-items-center gap-3 flex-wrap">
<i class="bi bi-clock-history"></i>
<span>Your session is about to end. Save your work, then sign in again.</span>
<button type="button" class="btn btn-sm btn-light ms-auto" (click)="signInAgain()">
Sign in again
</button>
</div>
</div>
}
<main id="main" class="app-content">
<router-outlet />
</main>
